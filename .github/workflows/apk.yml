name: apk

on:
  workflow_dispatch:
  push:
    branches:
      - build/apk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk "dist/dsh-mobile-${GITHUB_SHA::7}.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose dist/*.apk
          "$SDK/build-tools/36.0.0/aapt" dump badging dist/*.apk | grep -E '^(package|application-label):'
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk
          path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "APK performance comparison ${GITHUB_SHA::7}" \
            --notes "Performance comparison build from the build/apk branch. Install alongside the previous APK and pair this app separately."
